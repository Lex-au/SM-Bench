<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SM Bench — Compare</title>
    <meta name="description" content="Compare AI model safety benchmark runs side by side." />
    <meta name="theme-color" content="#080c12" />
    <link rel="icon" href="./logos/SMBench.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="compare" class="export-shell">
    <header class="site-header">
      <nav class="navbar" aria-label="Primary navigation">
        <a href="./index.html" class="brand" aria-label="SM Bench home">
          <img class="brand-mark" src="./logos/SMBench.svg" alt="" />
          <span class="brand-copy"><strong>SM</strong> Bench</span>
        </a>
        <div class="nav-links" aria-label="Benchmark pages">
          <a href="./index.html">Leaderboard</a>
          <a href="./ranking.html">Ranking</a>
          <a href="./compare.html" aria-current="page">Compare</a>
          <a href="./about.html">About</a>
        </div>
        <button class="theme-toggle" type="button" aria-label="Use light theme" aria-pressed="true">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z" />
          </svg>
        </button>
      </nav>
    </header>
    <main>
      <div class="container">
        <section class="card">
          <div class="export-page-heading">
            <span class="badge">Comparison lab</span>
            <h1>Compare model runs</h1>
            <p>Select runs to inspect score, category, cost, and verdict differences.</p>
          </div>
          <div class="export-toolbar">
            <div class="field export-toolbar-field">
              <label for="compare-search">Search runs</label>
              <input
                id="compare-search"
                class="input"
                placeholder="Search by model or vendor..."
              />
            </div>
            <div class="form-actions export-compare-actions">
              <button id="compare-select-all" class="button ghost" type="button">
                Select all shown
              </button>
              <button id="compare-clear-all" class="button ghost" type="button">
                Clear selection
              </button>
              <span id="compare-selection-status" class="export-toolbar-status"></span>
            </div>
          </div>
          <div id="compare-list" class="compare-run-list"></div>
          <div id="compare-content"></div>
        </section>
      </div>
    </main>
    <script src="./app.js?v=12"></script>
  </body>
</html>
